<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Operadores Algébricos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Operadores Algébricos</h1>
        <form id="calcForm">
            <div class="input-group">
                <label for="num1">Primeiro Número:</label>
                <input type="number" id="num1" step="any" placeholder="Digite o primeiro número" required>
            </div>
            <div class="input-group">
                <label for="num2">Segundo Número:</label>
                <input type="number" id="num2" step="any" placeholder="Digite o segundo número" required>
            </div>
            <button type="button" onclick="calcular()">Calcular</button>
        </form>

        <div id="resultados" class="resultados hidden">
            <h2>Resultados:</h2>
            <p><strong>Soma:</strong> <span id="soma"></span></p>
            <p><strong>Subtração:</strong> <span id="subtracao"></span></p>
            <p><strong>Multiplicação:</strong> <span id="multiplicacao"></span></p>
            <p><strong>Divisão:</strong> <span id="divisao"></span></p>
            <p><strong>Resto da divisão:</strong> <span id="resto"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
