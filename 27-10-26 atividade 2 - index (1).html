<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Operadores Lógicos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Verificação de CNH</h1>
        <form id="cnhForm">
            <div class="input-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" placeholder="Digite a sua idade" required min="0">
            </div>
            
            <div class="input-group checkbox-group">
                <input type="checkbox" id="possuiCnh">
                <label for="possuiCnh" class="checkbox-label">Possui CNH?</label>
            </div>

            <button type="button" onclick="verificarCnh()">Verificar</button>
        </form>

        <div id="resultado" class="resultado hidden">
            <p id="mensagemResultado"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
