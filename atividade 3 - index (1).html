<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Operadores Relacionais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Operadores Relacionais</h1>
        <form id="relForm">
            <div class="input-group">
                <label for="num1">Primeiro Número:</label>
                <input type="number" id="num1" step="any" placeholder="Digite o primeiro número" required>
            </div>
            <div class="input-group">
                <label for="num2">Segundo Número:</label>
                <input type="number" id="num2" step="any" placeholder="Digite o segundo número" required>
            </div>
            <button type="button" onclick="verificarRelacao()">Verificar</button>
        </form>

        <div id="resultados" class="resultados hidden">
            <h2>Resultados:</h2>
            <p><strong>Maior:</strong> <span id="maior"></span></p>
            <p><strong>Menor:</strong> <span id="menor"></span></p>
            <p><strong>Igualdade:</strong> <span id="igualdade"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
